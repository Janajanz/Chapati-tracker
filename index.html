<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Chapati Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; font-family: 'Segoe UI', sans-serif; background: #fafafa; }
        .header { background: linear-gradient(135deg, #8B4513, #a0522d); color: white; padding: 14px 16px; position: fixed; top: 0; left: 0; right: 0; height: 60px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        h1 { font-size: 24px; }
        .menu-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
        .sidebar { position: fixed; right: -280px; top: 0; width: 280px; height: 100%; background: white; z-index: 200; transition: right 0.3s; overflow-y: auto; padding-top: 60px; box-shadow: -2px 0 8px rgba(0,0,0,0.2); }
        .sidebar.open { right: 0; }
        .sidebar-item { padding: 16px; border-bottom: 1px solid #f0f0f0; cursor: pointer; font-size: 14px; font-weight: 500; }
        .sidebar-item:hover { background: #f5f5f5; }
        .overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 150; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .overlay.open { opacity: 1; pointer-events: all; }
        .container { position: fixed; top: 60px; left: 0; right: 0; bottom: 0; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }
        .view { display: none; }
        .view.active { display: block; }
        .card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h2 { font-size: 20px; margin-bottom: 16px; color: #333; }
        h3 { font-size: 16px; margin: 20px 0 12px 0; color: #555; font-weight: 600; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: #666; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: #8B4513; box-shadow: 0 0 0 2px rgba(139,69,19,0.1); }
        .btn { padding: 12px 16px; border: none; border-radius: 4px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; margin-bottom: 8px; }
        .btn-primary { background: #8B4513; color: white; }
        .btn-primary:hover { background: #7a3a0d; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-danger:hover { background: #c82333; }
        .item-card { background: #f9f9f9; padding: 12px; margin: 8px 0; border-radius: 6px; border-left: 4px solid #8B4513; }
        .item-card p { margin: 4px 0; font-size: 13px; }
        .summary { background: #f0f0f0; padding: 12px; border-radius: 6px; margin: 12px 0; }
        .summary-row { display: flex; justify-content: space-between; padding: 8px 0; }
        .summary-row.total { font-weight: 700; border-top: 2px solid #ddd; padding-top: 12px; }
        .color-carried { color: #27a745; }
        .color-owner { color: #ff9800; }
        .color-purchase { color: #2196f3; }
        .color-usage { color: #dc3545; }
        p { line-height: 1.5; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🫓 Chapati Tracker</h1>
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
    </div>
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-item" onclick="showTab('dashboard')">📊 Dashboard</div>
        <div class="sidebar-item" onclick="showTab('inventory')">🏪 Inventory</div>
        <div class="sidebar-item" onclick="showTab('sales')">💰 Sales</div>
        <div class="sidebar-item" onclick="showTab('debtors')">👥 Debtors</div>
        <div class="sidebar-item" onclick="showTab('creditors')">🏪 Creditors</div>
        <div class="sidebar-item" onclick="showTab('expenses')">💸 Expenses</div>
        <div class="sidebar-item" onclick="showTab('capital')">💰 Capital</div>
        <div class="sidebar-item" onclick="showTab('earnings')">💸 My Earnings</div>
        <div class="sidebar-item" onclick="showTab('analytics')">📈 Analytics</div>
        <div class="sidebar-item" onclick="showTab('history')">📅 History</div>
        <div class="sidebar-item" onclick="showTab('close')">🔒 Close Day</div>
        <div class="sidebar-item" onclick="showTab('backup')">💾 Backup</div>
    </div>
    <div class="container">
        <div id="dashboard" class="view active"><div class="card"><h2>📊 Dashboard</h2><div id="dashboard-content"></div></div></div>
        <div id="inventory" class="view"><div class="card"><h2>🏪 Inventory</h2><div id="inventory-content"></div></div></div>
        <div id="sales" class="view"><div class="card"><h2>💰 Sales</h2><div id="sales-content"></div></div></div>
        <div id="debtors" class="view"><div class="card"><h2>👥 Debtors</h2><div id="debtors-content"></div></div></div>
        <div id="creditors" class="view"><div class="card"><h2>🏪 Creditors</h2><div id="creditors-content"></div></div></div>
        <div id="expenses" class="view"><div class="card"><h2>💸 Expenses</h2><div id="expenses-content"></div></div></div>
        <div id="capital" class="view"><div class="card"><h2>💰 Capital</h2><div id="capital-content"></div></div></div>
        <div id="earnings" class="view"><div class="card"><h2>💸 My Earnings</h2><div id="earnings-content"></div></div></div>
        <div id="analytics" class="view"><div class="card"><h2>📈 Analytics</h2><div id="analytics-content"></div></div></div>
        <div id="history" class="view"><div class="card"><h2>📅 History</h2><div id="history-content"></div></div></div>
        <div id="close" class="view"><div class="card"><h2>🔒 Close Day</h2><div id="close-content"></div></div></div>
        <div id="backup" class="view"><div class="card"><h2>💾 Backup</h2><button class="btn btn-primary" onclick="downloadBackup()">📥 Download Backup</button><input type="file" id="restore-file" accept=".json" style="margin: 10px 0;"><button class="btn btn-primary" onclick="restoreBackup()">📤 Restore Backup</button><button class="btn btn-danger" onclick="if(confirm('DELETE ALL DATA?')) { localStorage.removeItem('chapatiBiz'); location.reload(); }">🗑️ Clear All</button></div></div>
    </div>

    <script>
        const KEY = 'chapatiBiz';
        let today = new Date().toISOString().split('T')[0];

        function load() { return JSON.parse(localStorage.getItem(KEY) || '{"days":{}}'); }
        function save(data) { localStorage.setItem(KEY, JSON.stringify(data)); }
        function fmt(n) { return parseInt(n || 0).toLocaleString(); }
        function toggleMenu() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('overlay').classList.toggle('open'); }
        
        function getDay(date) {
            const data = load();
            if (!data.days[date]) {
                data.days[date] = {
                    date: date,
                    status: 'open',
                    chapatiCarried: 0,
                    chapatiMade: 0,
                    chapatiRemaining: 0,
                    carriedItems: [],
                    ownerStock: [],
                    purchases: [],
                    usage: [],
                    sales: [],
                    expenses: [],
                    debtors: [],
                    creditors: [],
                    closingInventory: { chapati: 0, items: [] }
                };
                save(data);
            }
            return data.days[date];
        }

        function showTab(name) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            toggleMenu();
            
            if (name === 'dashboard') renderDashboard();
            else if (name === 'inventory') renderInventory();
            else if (name === 'sales') renderSales();
            else if (name === 'debtors') renderDebtors();
            else if (name === 'creditors') renderCreditors();
            else if (name === 'expenses') renderExpenses();
            else if (name === 'capital') renderCapital();
            else if (name === 'earnings') renderEarnings();
            else if (name === 'analytics') renderAnalytics();
            else if (name === 'history') renderHistory();
            else if (name === 'close') renderClose();
        }

        function renderDashboard() {
            const day = getDay(today);
            const chapatiCarried = day.chapatiCarried || 0;
            const chapatiMade = day.chapatiMade || 0;
            const totalAvailable = chapatiCarried + chapatiMade;
            const chapatiRemaining = day.chapatiRemaining || 0;
            const chapatySold = totalAvailable - chapatiRemaining;

            let html = '<h3>Production Tracking</h3>';
            html += '<div class="form-group"><label>Chapati Carried</label><input type="number" value="' + chapatiCarried + '" id="chapati-carried" onchange="updateChapati()"></div>';
            html += '<div class="form-group"><label>Chapati Made</label><input type="number" value="' + chapatiMade + '" id="chapati-made" onchange="updateChapati()"></div>';
            html += '<div class="summary"><div class="summary-row"><span>Total Available</span><span>' + totalAvailable + '</span></div><div class="summary-row"><span>Remaining</span><span>' + chapatiRemaining + '</span></div><div class="summary-row total"><span>Sold</span><span>' + chapatySold + '</span></div></div>';
            html += '<div class="form-group"><label>Chapati Remaining</label><input type="number" value="' + chapatiRemaining + '" id="chapati-remaining" onchange="updateChapati()"></div>';
            
            document.getElementById('dashboard-content').innerHTML = html;
        }

        function updateChapati() {
            const day = getDay(today);
            day.chapatiCarried = parseInt(document.getElementById('chapati-carried').value) || 0;
            day.chapatiMade = parseInt(document.getElementById('chapati-made').value) || 0;
            day.chapatiRemaining = parseInt(document.getElementById('chapati-remaining').value) || 0;
            const data = load();
            data.days[today] = day;
            save(data);
            renderDashboard();
        }

        function renderInventory() {
            const day = getDay(today);
            let html = '<h3 class="color-carried">✅ What Was Carried (Yesterday)</h3>';
            
            if (day.carriedItems.length > 0) {
                day.carriedItems.forEach(ci => {
                    html += '<div class="item-card"><p><strong>' + (ci.item || ci.name) + '</strong>: ' + ci.qty + ' @ UGX ' + fmt(ci.unitCost) + '</p></div>';
                });
            } else {
                html += '<p style="color: #999;">None</p>';
            }
            
            html += '<h3 class="color-owner">➕ What You Buy (Owner)</h3>';
            html += '<div class="form-group"><input type="text" id="owner-item" placeholder="Item name"></div>';
            html += '<div class="form-group"><input type="number" id="owner-qty" placeholder="Quantity"></div>';
            html += '<div class="form-group"><input type="number" id="owner-cost" placeholder="Unit cost"></div>';
            html += '<button class="btn btn-primary" onclick="addOwnerStock()">✓ Add Owner Stock</button>';
            
            if (day.ownerStock.length > 0) {
                day.ownerStock.forEach((os, i) => {
                    html += '<div class="item-card"><p><strong>' + os.item + '</strong>: ' + os.qty + ' @ UGX ' + fmt(os.unitCost) + ' <button class="btn btn-danger" onclick="delOwnerStock(' + i + ')">Delete</button></p></div>';
                });
            }
            
            html += '<h3 class="color-purchase">➕ Purchases (Worker)</h3>';
            if (day.purchases.length > 0) {
                day.purchases.forEach((p, i) => {
                    html += '<div class="item-card"><p><strong>' + p.item + '</strong>: ' + p.qty + ' @ UGX ' + fmt(p.unitCost) + ' <button class="btn btn-danger" onclick="delPurchase(' + i + ')">Delete</button></p></div>';
                });
            } else {
                html += '<p style="color: #999;">None</p>';
            }
            
            html += '<h3 class="color-usage">➖ Usage (What Was Used)</h3>';
            html += '<div class="form-group"><label>Select Item</label><select id="usage-item" onchange="autoFillUsageCost()"><option value="">-- Choose --</option>';
            
            const items = {};
            day.carriedItems.forEach(ci => { const n = (ci.item || ci.name); if (!items[n]) items[n] = ci.unitCost; });
            day.ownerStock.forEach(os => { if (!items[os.item]) items[os.item] = os.unitCost; });
            day.purchases.forEach(p => { if (!items[p.item]) items[p.item] = p.unitCost; });
            
            Object.keys(items).forEach(name => {
                html += '<option value="' + name + '|' + items[name] + '">' + name + ' (UGX ' + fmt(items[name]) + ')</option>';
            });
            
            html += '</select></div>';
            html += '<div class="form-group"><input type="number" id="usage-qty" placeholder="Quantity"></div>';
            html += '<div class="form-group"><input type="number" id="usage-cost" placeholder="Unit cost" readonly></div>';
            html += '<button class="btn btn-primary" onclick="addUsage()">✓ Add Usage</button>';
            
            if (day.usage.length > 0) {
                day.usage.forEach((u, i) => {
                    html += '<div class="item-card"><p><strong>' + u.item + '</strong>: ' + u.qty + ' @ UGX ' + fmt(u.unitCost) + ' = UGX ' + fmt(u.cost) + ' <button class="btn btn-danger" onclick="delUsage(' + i + ')">Delete</button></p></div>';
                });
            }
            
            const totalValue = calculateStockValue(day);
            html += '<h3>📊 Current Stock</h3><div class="summary"><div class="summary-row total"><span>Total Value</span><span>UGX ' + fmt(totalValue) + '</span></div></div>';
            
            document.getElementById('inventory-content').innerHTML = html;
        }

        function calculateStockValue(day) {
            const items = {};
            day.carriedItems.forEach(ci => {
                const n = ci.item || ci.name;
                if (!items[n]) items[n] = { qty: 0, cost: 0 };
                items[n].qty += ci.qty;
                items[n].cost += ci.qty * ci.unitCost;
            });
            day.ownerStock.forEach(os => {
                if (!items[os.item]) items[os.item] = { qty: 0, cost: 0 };
                items[os.item].qty += os.qty;
                items[os.item].cost += os.qty * os.unitCost;
            });
            day.purchases.forEach(p => {
                if (!items[p.item]) items[p.item] = { qty: 0, cost: 0 };
                items[p.item].qty += p.qty;
                items[p.item].cost += p.qty * p.unitCost;
            });
            day.usage.forEach(u => {
                if (items[u.item]) items[u.item].qty -= u.qty;
            });
            
            let total = 0;
            Object.keys(items).forEach(name => {
                if (items[name].qty > 0) {
                    const avg = items[name].cost / (items[name].qty + (day.usage.filter(u => u.item === name).reduce((s, u) => s + u.qty, 0)));
                    total += items[name].qty * avg;
                }
            });
            return total;
        }

        function addOwnerStock() {
            const day = getDay(today);
            const item = document.getElementById('owner-item').value.trim();
            const qty = parseInt(document.getElementById('owner-qty').value) || 0;
            const cost = parseInt(document.getElementById('owner-cost').value) || 0;
            if (!item || qty <= 0 || cost <= 0) { alert('Fill all fields'); return; }
            day.ownerStock.push({item, qty, unitCost: cost});
            const data = load();
            data.days[today] = day;
            save(data);
            document.getElementById('owner-item').value = '';
            document.getElementById('owner-qty').value = '';
            document.getElementById('owner-cost').value = '';
            renderInventory();
        }

        function delOwnerStock(i) { const day = getDay(today); day.ownerStock.splice(i, 1); const data = load(); data.days[today] = day; save(data); renderInventory(); }
        function delPurchase(i) { const day = getDay(today); day.purchases.splice(i, 1); const data = load(); data.days[today] = day; save(data); renderInventory(); }
        function delUsage(i) { const day = getDay(today); day.usage.splice(i, 1); const data = load(); data.days[today] = day; save(data); renderInventory(); }

        function autoFillUsageCost() {
            const val = document.getElementById('usage-item').value.split('|');
            document.getElementById('usage-cost').value = val[1] || '';
        }

        function addUsage() {
            const day = getDay(today);
            const val = document.getElementById('usage-item').value.split('|');
            const item = val[0];
            const qty = parseInt(document.getElementById('usage-qty').value) || 0;
            const cost = parseInt(document.getElementById('usage-cost').value) || 0;
            if (!item || qty <= 0 || cost <= 0) { alert('Fill all fields'); return; }
            day.usage.push({item, qty, unitCost: cost, cost: qty * cost});
            const data = load();
            data.days[today] = day;
            save(data);
            document.getElementById('usage-qty').value = '';
            renderInventory();
        }

        function renderSales() {
            const day = getDay(today);
            const total = day.sales.reduce((s, sl) => s + (sl.qty * sl.price), 0);
            
            let html = '<h3>Add Sale</h3>';
            html += '<div class="form-group"><select id="sale-product"><option value="Chapati">Chapati</option><option value="Eggs">Eggs</option><option value="Rolex">Rolex</option><option value="Other">Other</option></select></div>';
            html += '<div class="form-group"><input type="number" id="sale-qty" placeholder="Quantity"></div>';
            html += '<div class="form-group"><input type="number" id="sale-price" placeholder="Price"></div>';
            html += '<button class="btn btn-primary" onclick="addSale()">✓ Add Sale</button>';
            html += '<h3>Sales (' + day.sales.length + ')</h3>';
            
            day.sales.forEach((s, i) => {
                html += '<div class="item-card"><p><strong>' + s.product + '</strong>: ' + s.qty + ' x UGX ' + fmt(s.price) + ' = UGX ' + fmt(s.qty * s.price) + ' <button class="btn btn-danger" onclick="delSale(' + i + ')">Del</button></p></div>';
            });
            
            html += '<div class="summary"><div class="summary-row total"><span>Total Revenue</span><span>UGX ' + fmt(total) + '</span></div></div>';
            document.getElementById('sales-content').innerHTML = html;
        }

        function addSale() { const day = getDay(today); const product = document.getElementById('sale-product').value; const qty = parseInt(document.getElementById('sale-qty').value) || 0; const price = parseInt(document.getElementById('sale-price').value) || 0; if (qty <= 0 || price <= 0) { alert('Invalid'); return; } day.sales.push({product, qty, price}); const data = load(); data.days[today] = day; save(data); document.getElementById('sale-qty').value = ''; document.getElementById('sale-price').value = ''; renderSales(); }
        function delSale(i) { const day = getDay(today); day.sales.splice(i, 1); const data = load(); data.days[today] = day; save(data); renderSales(); }

        function renderExpenses() {
            const day = getDay(today);
            const total = day.expenses.reduce((s, e) => s + e.amount, 0);
            
            let html = '<h3>Add Expense</h3>';
            html += '<div class="form-group"><input type="text" id="exp-desc" placeholder="Description"></div>';
            html += '<div class="form-group"><select id="exp-cat"><option>Meals</option><option>Transport</option><option>Other</option></select></div>';
            html += '<div class="form-group"><input type="number" id="exp-amt" placeholder="Amount"></div>';
            html += '<button class="btn btn-primary" onclick="addExpense()">✓ Add</button>';
            html += '<h3>Expenses (' + day.expenses.length + ')</h3>';
            
            day.expenses.forEach((e, i) => {
                html += '<div class="item-card"><p><strong>' + e.desc + '</strong> - UGX ' + fmt(e.amount) + ' (' + e.category + ') <button class="btn btn-danger" onclick="delExpense(' + i + ')">Del</button></p></div>';
            });
            
            html += '<div class="summary"><div class="summary-row total"><span>Total Expenses</span><span>UGX ' + fmt(total) + '</span></div></div>';
            document.getElementById('expenses-content').innerHTML = html;
        }

        function addExpense() { const day = getDay(today); const desc = document.getElementById('exp-desc').value; const cat = document.getElementById('exp-cat').value; const amt = parseInt(document.getElementById('exp-amt').value) || 0; if (!desc || amt <= 0) { alert('Invalid'); return; } day.expenses.push({desc, category: cat, amount: amt}); const data = load(); data.days[today] = day; save(data); document.getElementById('exp-desc').value = ''; document.getElementById('exp-amt').value = ''; renderExpenses(); }
        function delExpense(i) { const day = getDay(today); day.expenses.splice(i, 1); const data = load(); data.days[today] = day; save(data); renderExpenses(); }

        function renderCapital() {
            const day = getDay(today);
            const revenue = day.sales.reduce((s, sl) => s + (sl.qty * sl.price), 0);
            const cogs = day.usage.reduce((s, u) => s + u.cost, 0);
            const expenses = day.expenses.reduce((s, e) => s + e.amount, 0);
            const profit = revenue - cogs - expenses;
            const stockValue = calculateStockValue(day);
            
            const allPurchases = (day.ownerStock || []).reduce((s, os) => s + (os.qty * os.unitCost), 0) + (day.purchases || []).reduce((s, p) => s + (p.qty * p.unitCost), 0);
            const cash = revenue - allPurchases - expenses;
            
            let html = '<h3>Cash Position</h3>';
            html += '<div class="summary"><div class="summary-row"><span>Revenue (Sales)</span><span>UGX ' + fmt(revenue) + '</span></div>';
            html += '<div class="summary-row"><span>- All Purchases</span><span>UGX ' + fmt(allPurchases) + '</span></div>';
            html += '<div class="summary-row"><span>- Expenses</span><span>UGX ' + fmt(expenses) + '</span></div>';
            html += '<div class="summary-row total"><span>Cash at Hand</span><span>UGX ' + fmt(cash) + '</span></div></div>';
            
            html += '<h3>Profit (50/50 Split)</h3>';
            html += '<div class="summary"><div class="summary-row"><span>Revenue</span><span>UGX ' + fmt(revenue) + '</span></div>';
            html += '<div class="summary-row"><span>- COGS</span><span>UGX ' + fmt(cogs) + '</span></div>';
            html += '<div class="summary-row"><span>- Expenses</span><span>UGX ' + fmt(expenses) + '</span></div>';
            html += '<div class="summary-row total"><span>Total Profit</span><span>UGX ' + fmt(profit) + '</span></div>';
            html += '<div class="summary-row"><span>Your Share (50%)</span><span style="color: #27a745; font-weight: 700;">UGX ' + fmt(profit / 2) + '</span></div>';
            html += '<div class="summary-row"><span>Worker Share (50%)</span><span style="color: #2196f3; font-weight: 700;">UGX ' + fmt(profit / 2) + '</span></div></div>';
            
            html += '<h3>Total Capital</h3>';
            html += '<div class="summary"><div class="summary-row"><span>Cash</span><span>UGX ' + fmt(cash) + '</span></div>';
            html += '<div class="summary-row total"><span>+ Stock Value</span><span>UGX ' + fmt(stockValue) + '</span></div>';
            html += '<div class="summary-row total" style="color: #27a745;"><span>TOTAL CAPITAL</span><span>UGX ' + fmt(cash + stockValue) + '</span></div></div>';
            
            document.getElementById('capital-content').innerHTML = html;
        }

        function renderEarnings() {
            const data = load();
            const days = data.days || {};
            let total = 0;
            let month = 0;
            let week = 0;
            
            const now = new Date(today);
            const weekAgo = new Date(now.getTime() - 7 * 86400000).toISOString().split('T')[0];
            const currentMonth = today.substring(0, 7);
            
            let html = '<h3>Your Personal Earnings</h3>';
            html += '<div class="summary"><div class="summary-row total"><span>TODAY</span>';
            
            if (days[today]) {
                const d = days[today];
                const rev = d.sales.reduce((s, sl) => s + (sl.qty * sl.price), 0);
                const cogs = d.usage.reduce((s, u) => s + u.cost, 0);
                const exp = d.expenses.reduce((s, e) => s + e.amount, 0);
                const earning = (rev - cogs - exp) / 2;
                html += '<span style="color: #27a745; font-weight: 700;">UGX ' + fmt(earning) + '</span>';
                total += earning;
                month += earning;
                week += earning;
            } else {
                html += '<span>UGX 0</span>';
            }
            
            html += '</div>';
            html += '<div class="summary-row total"><span>LAST 7 DAYS</span><span style="color: #2196f3; font-weight: 700;">UGX ' + fmt(week) + '</span></div>';
            html += '<div class="summary-row total"><span>THIS MONTH</span><span style="color: #ff9800; font-weight: 700;">UGX ' + fmt(month) + '</span></div>';
            html += '<div class="summary-row total" style="color: #9c27b0;"><span>ALL TIME</span><span>UGX ' + fmt(total) + '</span></div></div>';
            
            document.getElementById('earnings-content').innerHTML = html;
        }

        function renderDebtors() {
            const day = getDay(today);
            if (!day.debtors) day.debtors = [];
            const total = day.debtors.reduce((s, d) => s + (d.amount - (d.paid || 0)), 0);
            
            let html = '<h3>Add Debtor</h3>';
            html += '<div class="form-group"><input type="text" id="debtor-name" placeholder="Name"></div>';
            html += '<div class="form-group"><input type="number" id="debtor-amount" placeholder="Amount"></div>';
            html += '<button class="btn btn-primary" onclick="addDebtor()">✓ Add</button>';
            html += '<h3>Debtors (' + day.debtors.length + ')</h3>';
            
            day.debtors.forEach((d, i) => {
                const paid = d.paid || 0;
                const remaining = d.amount - paid;
                html += '<div class="item-card"><p><strong>' + d.name + '</strong> - UGX ' + fmt(d.amount) + ' | Paid: UGX ' + fmt(paid) + ' | Remaining: UGX ' + fmt(remaining) + ' <button class="btn btn-danger" onclick="delDebtor(' + i + ')">Del</button></p></div>';
            });
            
            html += '<div class="summary"><div class="summary-row total"><span>Total Outstanding</span><span>UGX ' + fmt(total) + '</span></div></div>';
            document.getElementById('debtors-content').innerHTML = html;
        }

        function addDebtor() { const day = getDay(today); if (!day.debtors) day.debtors = []; const name = document.getElementById('debtor-name').value; const amount = parseInt(document.getElementById('debtor-amount').value) || 0; if (!name || amount <= 0) { alert('Invalid'); return; } day.debtors.push({name, amount, paid: 0}); const data = load(); data.days[today] = day; save(data); document.getElementById('debtor-name').value = ''; document.getElementById('debtor-amount').value = ''; renderDebtors(); }
        function delDebtor(i) { const day = getDay(today); day.debtors.splice(i, 1); const data = load(); data.days[today] = day; save(data); renderDebtors(); }

        function renderCreditors() {
            const day = getDay(today);
            if (!day.creditors) day.creditors = [];
            const total = day.creditors.reduce((s, c) => s + (c.amount - (c.paid || 0)), 0);
            
            let html = '<h3>Add Creditor</h3>';
            html += '<div class="form-group"><input type="text" id="creditor-name" placeholder="Name"></div>';
            html += '<div class="form-group"><input type="number" id="creditor-amount" placeholder="Amount"></div>';
            html += '<button class="btn btn-primary" onclick="addCreditor()">✓ Add</button>';
            html += '<h3>Creditors (' + day.creditors.length + ')</h3>';
            
            day.creditors.forEach((c, i) => {
                const paid = c.paid || 0;
                const remaining = c.amount - paid;
                html += '<div class="item-card"><p><strong>' + c.name + '</strong> - UGX ' + fmt(c.amount) + ' | Paid: UGX ' + fmt(paid) + ' | Remaining: UGX ' + fmt(remaining) + ' <button class="btn btn-danger" onclick="delCreditor(' + i + ')">Del</button></p></div>';
            });
            
            html += '<div class="summary"><div class="summary-row total"><span>Total Owed</span><span>UGX ' + fmt(total) + '</span></div></div>';
            document.getElementById('creditors-content').innerHTML = html;
        }

        function addCreditor() { const day = getDay(today); if (!day.creditors) day.creditors = []; const name = document.getElementById('creditor-name').value; const amount = parseInt(document.getElementById('creditor-amount').value) || 0; if (!name || amount <= 0) { alert('Invalid'); return; } day.creditors.push({name, amount, paid: 0}); const data = load(); data.days[today] = day; save(data); document.getElementById('creditor-name').value = ''; document.getElementById('creditor-amount').value = ''; renderCreditors(); }
        function delCreditor(i) { const day = getDay(today); day.creditors.splice(i, 1); const data = load(); data.days[today] = day; save(data); renderCreditors(); }

        function renderAnalytics() {
            const data = load();
            const days = data.days || {};
            const daysList = Object.keys(days).sort().reverse().slice(0, 7);
            
            let html = '<h3>Last 7 Days</h3>';
            daysList.forEach(date => {
                const d = days[date];
                const rev = d.sales.reduce((s, sl) => s + (sl.qty * sl.price), 0);
                const cogs = d.usage.reduce((s, u) => s + u.cost, 0);
                const exp = d.expenses.reduce((s, e) => s + e.amount, 0);
                const profit = rev - cogs - exp;
                html += '<div class="item-card"><p><strong>' + date + '</strong></p>';
                html += '<p style="font-size: 12px;">Revenue: UGX ' + fmt(rev) + ' | COGS: UGX ' + fmt(cogs) + ' | Expenses: UGX ' + fmt(exp) + '</p>';
                html += '<p style="font-weight: 700; color: #27a745;">Profit: UGX ' + fmt(profit) + '</p></div>';
            });
            
            document.getElementById('analytics-content').innerHTML = html;
        }

        function renderHistory() {
            const data = load();
            const days = data.days || {};
            const daysList = Object.keys(days).sort().reverse();
            
            let html = '<h3>All Days</h3>';
            if (daysList.length === 0) {
                html += '<p style="color: #999;">No days recorded</p>';
            } else {
                daysList.forEach(date => {
                    const d = days[date];
                    const rev = d.sales.reduce((s, sl) => s + (sl.qty * sl.price), 0);
                    const profit = rev - d.usage.reduce((s, u) => s + u.cost, 0) - d.expenses.reduce((s, e) => s + e.amount, 0);
                    html += '<div class="item-card" onclick="showHistoryDetail(\'' + date + '\')" style="cursor: pointer;"><p><strong>' + date + '</strong> ' + (d.status === 'closed' ? '✓' : '') + '</p>';
                    html += '<p style="font-size: 12px;">Revenue: UGX ' + fmt(rev) + ' | Profit: UGX ' + fmt(profit) + '</p>';
                    html += '<p style="font-size: 11px; color: #0066cc;">Tap to view details</p></div>';
                });
            }
            
            document.getElementById('history-content').innerHTML = html;
        }

        function showHistoryDetail(date) {
            const data = load();
            const d = data.days[date];
            if (!d) return;
            
            const rev = d.sales.reduce((s, sl) => s + (sl.qty * sl.price), 0);
            const cogs = d.usage.reduce((s, u) => s + u.cost, 0);
            const exp = d.expenses.reduce((s, e) => s + e.amount, 0);
            const profit = rev - cogs - exp;
            
            let html = '<button class="btn btn-primary" onclick="renderHistory()">← Back to History</button>';
            html += '<h3>' + date + ' - Full Details</h3>';
            
            html += '<h4>Inventory</h4>';
            if (d.carriedItems && d.carriedItems.length > 0) {
                html += '<p style="font-weight: 600; color: #27a745;">Carried:</p>';
                d.carriedItems.forEach(ci => {
                    html += '<div class="item-card"><p>' + (ci.item || ci.name) + ': ' + ci.qty + ' @ UGX ' + fmt(ci.unitCost) + '</p></div>';
                });
            }
            
            if (d.ownerStock && d.ownerStock.length > 0) {
                html += '<p style="font-weight: 600; color: #ff9800;">Owner Bought:</p>';
                d.ownerStock.forEach(os => {
                    html += '<div class="item-card"><p>' + os.item + ': ' + os.qty + ' @ UGX ' + fmt(os.unitCost) + '</p></div>';
                });
            }
            
            if (d.purchases && d.purchases.length > 0) {
                html += '<p style="font-weight: 600; color: #2196f3;">Purchases:</p>';
                d.purchases.forEach(p => {
                    html += '<div class="item-card"><p>' + p.item + ': ' + p.qty + ' @ UGX ' + fmt(p.unitCost) + '</p></div>';
                });
            }
            
            if (d.usage && d.usage.length > 0) {
                html += '<p style="font-weight: 600; color: #dc3545;">Usage:</p>';
                d.usage.forEach(u => {
                    html += '<div class="item-card"><p>' + u.item + ': ' + u.qty + ' @ UGX ' + fmt(u.unitCost) + '</p></div>';
                });
            }
            
            html += '<h4>Sales & Finances</h4>';
            html += '<div class="summary"><div class="summary-row"><span>Revenue</span><span>UGX ' + fmt(rev) + '</span></div>';
            html += '<div class="summary-row"><span>COGS</span><span>UGX ' + fmt(cogs) + '</span></div>';
            html += '<div class="summary-row"><span>Expenses</span><span>UGX ' + fmt(exp) + '</span></div>';
            html += '<div class="summary-row total"><span>Profit</span><span>UGX ' + fmt(profit) + '</span></div></div>';
            
            if (d.closingInventory && d.closingInventory.items && d.closingInventory.items.length > 0) {
                html += '<h4>What Remained</h4>';
                d.closingInventory.items.forEach(ci => {
                    html += '<div class="item-card"><p><strong>' + ci.name + '</strong>: ' + ci.qty + ' @ UGX ' + fmt(ci.unitCost) + '</p></div>';
                });
            }
            
            document.getElementById('history-content').innerHTML = html;
        }

        function renderClose() {
            const day = getDay(today);
            const revenue = day.sales.reduce((s, sl) => s + (sl.qty * sl.price), 0);
            const cogs = day.usage.reduce((s, u) => s + u.cost, 0);
            const expenses = day.expenses.reduce((s, e) => s + e.amount, 0);
            const profit = revenue - cogs - expenses;
            
            const items = {};
            day.carriedItems.forEach(ci => { const n = ci.item || ci.name; if (!items[n]) items[n] = { qty: 0, cost: 0 }; items[n].qty += ci.qty; items[n].cost += ci.qty * ci.unitCost; });
            day.ownerStock.forEach(os => { if (!items[os.item]) items[os.item] = { qty: 0, cost: 0 }; items[os.item].qty += os.qty; items[os.item].cost += os.qty * os.unitCost; });
            day.purchases.forEach(p => { if (!items[p.item]) items[p.item] = { qty: 0, cost: 0 }; items[p.item].qty += p.qty; items[p.item].cost += p.qty * p.unitCost; });
            day.usage.forEach(u => { if (items[u.item]) items[u.item].qty -= u.qty; });
            
            let html = '<h3>Day Summary</h3>';
            html += '<div class="summary"><div class="summary-row"><span>Revenue</span><span>UGX ' + fmt(revenue) + '</span></div>';
            html += '<div class="summary-row"><span>COGS</span><span>UGX ' + fmt(cogs) + '</span></div>';
            html += '<div class="summary-row"><span>Expenses</span><span>UGX ' + fmt(expenses) + '</span></div>';
            html += '<div class="summary-row total" style="color: #27a745;"><span>PROFIT</span><span>UGX ' + fmt(profit) + '</span></div></div>';
            
            html += '<h3>Closing Inventory (Carry to Next Day)</h3>';
            Object.keys(items).forEach(name => {
                if (items[name].qty > 0) {
                    const avg = items[name].cost / (items[name].qty + (day.usage.filter(u => u.item === name).reduce((s, u) => s + u.qty, 0)));
                    html += '<div class="item-card"><p><strong>' + name + '</strong>: ' + items[name].qty + ' @ UGX ' + fmt(avg) + '</p></div>';
                }
            });
            
            html += '<button class="btn btn-primary" onclick="closeDay()" style="margin-top: 20px; background: #27a745;">✓ Close Day & Move to Tomorrow</button>';
            document.getElementById('close-content').innerHTML = html;
        }

        function closeDay() {
            const day = getDay(today);
            const items = {};
            day.carriedItems.forEach(ci => { const n = ci.item || ci.name; if (!items[n]) items[n] = { qty: 0, cost: 0 }; items[n].qty += ci.qty; items[n].cost += ci.qty * ci.unitCost; });
            day.ownerStock.forEach(os => { if (!items[os.item]) items[os.item] = { qty: 0, cost: 0 }; items[os.item].qty += os.qty; items[os.item].cost += os.qty * os.unitCost; });
            day.purchases.forEach(p => { if (!items[p.item]) items[p.item] = { qty: 0, cost: 0 }; items[p.item].qty += p.qty; items[p.item].cost += p.qty * p.unitCost; });
            day.usage.forEach(u => { if (items[u.item]) items[u.item].qty -= u.qty; });
            
            const closing = [];
            Object.keys(items).forEach(name => {
                if (items[name].qty > 0) {
                    const used = day.usage.filter(u => u.item === name).reduce((s, u) => s + u.qty, 0);
                    const totalQty = items[name].qty + used;
                    const avg = items[name].cost / totalQty;
                    closing.push({name, qty: items[name].qty, unitCost: avg});
                }
            });
            
            day.closingInventory = {chapati: day.chapatiRemaining, items: closing};
            day.status = 'closed';
            const data = load();
            data.days[today] = day;
            save(data);
            
            today = new Date(new Date().getTime() + 86400000).toISOString().split('T')[0];
            alert('✓ Day closed! Moved to ' + today);
            renderDashboard();
        }

        function downloadBackup() { const blob = new Blob([JSON.stringify(load(), null, 2)], {type: 'application/json'}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'chapati-backup.json'; a.click(); URL.revokeObjectURL(url); }
        function restoreBackup() { const file = document.getElementById('restore-file').files[0]; if (!file) { alert('Select a file'); return; } const reader = new FileReader(); reader.onload = e => { try { save(JSON.parse(e.target.result)); alert('✓ Restored!'); location.reload(); } catch (err) { alert('Error reading file'); } }; reader.readAsText(file); }

        window.addEventListener('load', () => renderDashboard());
    </script>
