<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Chapati Tracker v12.0 Complete</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; font-family: 'Segoe UI', sans-serif; background: #fafafa; }
        .header { background: linear-gradient(135deg, #8B4513, #a0522d); color: white; padding: 14px 16px; position: fixed; top: 0; left: 0; right: 0; height: 60px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .menu-btn { background: none; border: none; color: white; font-size: 24px; cursor: pointer; }
        .sidebar { position: fixed; right: -280px; top: 0; width: 280px; height: 100%; background: white; z-index: 200; transition: right 0.3s; overflow-y: auto; padding-top: 60px; }
        .sidebar.open { right: 0; }
        .sidebar-item { padding: 16px; border-bottom: 1px solid #f0f0f0; cursor: pointer; font-size: 14px; font-weight: 500; }
        .sidebar-item:hover { background: #f5f5f5; }
        .overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 150; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .overlay.open { opacity: 1; pointer-events: all; }
        .container { position: fixed; top: 60px; left: 0; right: 0; bottom: 0; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }
        .view { display: none; }
        .view.active { display: block; }
        .card { background: white; border-radius: 12px; padding: 18px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .card h2 { font-size: 18px; margin-bottom: 16px; }
        .card h3 { font-size: 13px; margin: 16px 0 12px; color: #666; font-weight: 700; text-transform: uppercase; }
        .form-group { margin-bottom: 14px; }
        .form-group label { font-size: 12px; font-weight: 600; color: #666; display: block; margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; margin-bottom: 10px; }
        .btn-primary { background: linear-gradient(135deg, #8B4513, #a0522d); color: white; }
        .btn-danger { background: #dc3545; color: white; font-size: 12px; padding: 6px; }
        .item-card { background: white; border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
        .summary { background: #f9f7f4; border-radius: 10px; padding: 14px; margin-bottom: 16px; }
        .summary-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,0.05); font-size: 13px; }
        .summary-row.total { font-weight: 700; color: #8B4513; border: none; padding-top: 12px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🫓 Chapati Tracker</h1>
        <button class="menu-btn" onclick="toggleMenu()">☰</button>
    </div>
    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-item" onclick="showTab('dashboard')">📊 Dashboard</div>
        <div class="sidebar-item" onclick="showTab('inventory')">🏪 Inventory</div>
        <div class="sidebar-item" onclick="showTab('sales')">💰 Sales</div>
        <div class="sidebar-item" onclick="showTab('debtors')">👥 Debtors</div>
        <div class="sidebar-item" onclick="showTab('creditors')">🏪 Creditors</div>
        <div class="sidebar-item" onclick="showTab('expenses')">💸 Expenses</div>
        <div class="sidebar-item" onclick="showTab('capital')">💰 Capital</div>
        <div class="sidebar-item" onclick="showTab('analytics')">📈 Analytics</div>
        <div class="sidebar-item" onclick="showTab('history')">📅 History</div>
        <div class="sidebar-item" onclick="showTab('close')">🔒 Close Day</div>
        <div class="sidebar-item" onclick="showTab('backup')">💾 Backup</div>
    </div>
    <div class="container">
        <div id="dashboard" class="view active"><div class="card"><h2>📊 Dashboard</h2><div id="dashboard-content"></div></div></div>
        <div id="inventory" class="view"><div class="card"><h2>🏪 Inventory</h2><div id="inventory-content"></div></div></div>
        <div id="sales" class="view"><div class="card"><h2>💰 Sales</h2><div id="sales-content"></div></div></div>
        <div id="debtors" class="view"><div class="card"><h2>👥 Debtors</h2><div id="debtors-content"></div></div></div>
        <div id="creditors" class="view"><div class="card"><h2>🏪 Creditors</h2><div id="creditors-content"></div></div></div>
        <div id="expenses" class="view"><div class="card"><h2>💸 Expenses</h2><div id="expenses-content"></div></div></div>
        <div id="capital" class="view"><div class="card"><h2>💰 Capital</h2><div id="capital-content"></div></div></div>
        <div id="analytics" class="view"><div class="card"><h2>📈 Analytics</h2><div id="analytics-content"></div></div></div>
        <div id="history" class="view"><div class="card"><h2>📅 History</h2><div id="history-content"></div></div></div>
        <div id="close" class="view"><div class="card"><h2>🔒 Close Day</h2><div id="close-content"></div></div></div>
        <div id="backup" class="view"><div class="card"><h2>💾 Backup</h2><button class="btn btn-primary" onclick="downloadBackup()">📥 Download</button><input type="file" id="restore-file" accept=".json" style="margin: 10px 0; padding: 8px; width: 100%; border: 1px solid #ddd; border-radius: 4px;"><button class="btn btn-primary" onclick="restoreBackup()">📤 Restore</button><button class="btn btn-danger" style="width: 100%;" onclick="if(confirm('DELETE ALL?')) { localStorage.removeItem('chapatiBiz'); location.reload(); }">🗑️ Clear All</button></div></div>
    </div>

    <script>
        const KEY = 'chapatiBiz';
        let today = new Date().toISOString().split('T')[0];

        function load() { return JSON.parse(localStorage.getItem(KEY) || '{"days":{}}'); }
        function save(data) { localStorage.setItem(KEY, JSON.stringify(data)); }
        function fmt(n) { return parseInt(n || 0).toLocaleString(); }
        function msg(text) { alert('✓ ' + text); }
        
        function getDay(date) {
            const data = load();
            if (!data.days[date]) {
                // Check if previous day exists and has closing inventory
                const prevDate = new Date(new Date(date).getTime() - 86400000).toISOString().split('T')[0];
                let chapatiCarried = 0;
                let carryoverItems = [];
                
                if (data.days[prevDate] && data.days[prevDate].closingInventory) {
                    chapatiCarried = data.days[prevDate].closingInventory.chapati || 0;
                    // Carry over all remaining items as opening inventory
                    if (data.days[prevDate].closingInventory.items && data.days[prevDate].closingInventory.items.length > 0) {
                        carryoverItems = data.days[prevDate].closingInventory.items.map(item => ({
                            item: item.name,
                            qty: item.qty,
                            unitCost: item.unitCost
                        }));
                    }
                }
                
                data.days[date] = {
                    date, status: 'open',
                    chapatiCarried: chapatiCarried, chapatiMade: 0, chapatiRemaining: 0,
                    purchases: carryoverItems, // Start with previous day's remaining items
                    usage: [], sales: [], expenses: [],
                    debtors: [], creditors: [],
                    closingInventory: { chapati: 0, items: [] }
                };
                save(data);
            }
            return data.days[date];
        }

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('open');
        }

        function showTab(name) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(name).classList.add('active');
            toggleMenu();
            
            if (name === 'dashboard') renderDashboard();
            else if (name === 'inventory') renderInventory();
            else if (name === 'sales') renderSales();
            else if (name === 'debtors') renderDebtors();
            else if (name === 'creditors') renderCreditors();
            else if (name === 'expenses') renderExpenses();
            else if (name === 'capital') renderCapital();
            else if (name === 'analytics') renderAnalytics();
            else if (name === 'history') renderHistory();
            else if (name === 'close') renderClose();
        }

        function renderDashboard() {
            const day = getDay(today);
            const revenue = day.sales.reduce((s, sl) => s + (sl.qty * sl.price), 0);
            const cogs = day.usage.reduce((s, u) => s + u.cost, 0);
            const expenses = day.expenses.reduce((s, e) => s + e.amount, 0);
            const profit = revenue - cogs - expenses;
            
            // CALCULATE SOLD
            const carried = day.chapatiCarried || 0;
            const made = day.chapatiMade || 0;
            const remaining = day.chapatiRemaining || 0;
            const sold = (carried + made) - remaining;
            
            let html = '<p style="color: #8B4513; font-weight: 700; margin-bottom: 16px;">' + today + '</p>';
            html += '<h3>Production</h3>';
            html += '<div class="form-group"><label>Carried</label><input type="number" id="carried" value="' + carried + '" onchange="updateProduction()"></div>';
            html += '<div class="form-group"><label>Made</label><input type="number" id="made" value="' + made + '" onchange="updateProduction()"></div>';
            html += '<div class="form-group"><label>Remaining</label><input type="number" id="remaining" value="' + remaining + '" onchange="updateProduction()"></div>';
            html += '<div class="summary">';
            html += '<div class="summary-row"><span>Total Available</span><span>' + (carried + made) + '</span></div>';
            html += '<div class="summary-row total"><span>SOLD</span><span style="font-weight: 700; color: #8B4513;">' + sold + '</span></div>';
            html += '</div>';
            
            html += '<h3>Financial</h3>';
            html += '<div class="summary">';
            html += '<div class="summary-row"><span>Revenue</span><span>UGX ' + fmt(revenue) + '</span></div>';
            html += '<div class="summary-row"><span>COGS</span><span>UGX ' + fmt(cogs) + '</span></div>';
            html += '<div class="summary-row"><span>Expenses</span><span>UGX ' + fmt(expenses) + '</span></div>';
            html += '<div class="summary-row total"><span>PROFIT</span><span style="color: ' + (profit > 0 ? '#27a745' : '#dc3545') + ';">UGX ' + fmt(Math.abs(profit)) + '</span></div>';
            html += '<div class="summary-row" style="margin-top: 12px;"><span>👤 Owner (50%)</span><span>UGX ' + fmt(profit > 0 ? profit / 2 : 0) + '</span></div>';
            html += '<div class="summary-row"><span>👷 Worker (50%)</span><span>UGX ' + fmt(profit > 0 ? profit / 2 : 0) + '</span></div>';
            html += '</div>';
            document.getElementById('dashboard-content').innerHTML = html;
        }

        function updateProduction() {
            const day = getDay(today);
            day.chapatiCarried = parseInt(document.getElementById('carried').value) || 0;
            day.chapatiMade = parseInt(document.getElementById('made').value) || 0;
            day.chapatiRemaining = parseInt(document.getElementById('remaining').value) || 0;
            save({...load(), days: {...load().days, [today]: day}});
        }

        function renderInventory() {
            const day = getDay(today);
            let html = '<h3>Add Purchase</h3>';
            html += '<div class="form-group"><input type="text" id="purch-item" placeholder="Item"></div>';
            html += '<div class="form-group"><input type="number" id="purch-qty" placeholder="Qty"></div>';
            html += '<div class="form-group"><input type="number" id="purch-cost" placeholder="Unit Cost"></div>';
            html += '<button class="btn btn-primary" onclick="addPurchase()">✓ Add</button>';
            
            html += '<h3>Add Usage</h3>';
            html += '<div class="form-group"><select id="usage-item" onchange="autoFillUsageCost()"><option>-- Select --</option>';
            const items = new Set();
            day.purchases.forEach(p => { if (!items.has(p.item)) { html += '<option>' + p.item + '</option>'; items.add(p.item); }});
            html += '</select></div>';
            html += '<div class="form-group"><input type="number" id="usage-qty" placeholder="Qty"></div>';
            html += '<div class="form-group"><input type="number" id="usage-cost" placeholder="Unit Cost" readonly></div>';
            html += '<button class="btn btn-primary" onclick="addUsage()">✓ Add</button>';
            
            html += '<h3>Purchases (' + day.purchases.length + ')</h3><div id="purchases-list"></div>';
            html += '<h3>Usage (' + day.usage.length + ')</h3><div id="usage-list"></div>';
            html += '<h3>Current Stock</h3><div id="stock-list"></div>';
            
            document.getElementById('inventory-content').innerHTML = html;
            
            let pList = '';
            day.purchases.forEach((p, i) => {
                pList += '<div class="item-card"><p><strong>' + p.item + '</strong> - ' + p.qty + ' @ ' + fmt(p.unitCost) + ' = UGX ' + fmt(p.qty * p.unitCost) + '</p><button class="btn btn-danger" onclick="delPurchase(' + i + ')">Delete</button></div>';
            });
            document.getElementById('purchases-list').innerHTML = pList || '<p>None</p>';
            
            let uList = '';
            let totalCogs = 0;
            day.usage.forEach((u, i) => { totalCogs += u.cost; uList += '<div class="item-card"><p><strong>' + u.item + '</strong> - ' + u.qty + ' @ ' + fmt(u.unitCost) + ' = UGX ' + fmt(u.cost) + '</p><button class="btn btn-danger" onclick="delUsage(' + i + ')">Delete</button></div>'; });
            if (uList) uList = '<p style="font-weight: 700;">COGS: UGX ' + fmt(totalCogs) + '</p>' + uList;
            document.getElementById('usage-list').innerHTML = uList || '<p>None</p>';
            
            let sList = '';
            let stockValue = 0;
            const itemMap = {};
            day.purchases.forEach(p => {
                if (!itemMap[p.item]) itemMap[p.item] = { totalQty: 0, totalCost: 0 };
                itemMap[p.item].totalQty += p.qty;
                itemMap[p.item].totalCost += p.qty * p.unitCost;
            });
            Object.keys(itemMap).forEach(itemName => {
                const totalQty = itemMap[itemName].totalQty;
                const totalCost = itemMap[itemName].totalCost;
                const used = day.usage.filter(u => u.item === itemName).reduce((s, u) => s + u.qty, 0);
                const remain = totalQty - used;
                if (remain > 0) {
                    const avgCost = totalCost / totalQty;
                    const value = remain * avgCost;
                    stockValue += value;
                    sList += '<div class="item-card"><p><strong>' + itemName + '</strong></p><p style="font-size: 12px;">Purchased: ' + totalQty + ' | Used: ' + used + ' | Remaining: <strong>' + remain + '</strong></p><p style="font-size: 12px; font-weight: 700;">Value: UGX ' + fmt(value) + '</p></div>';
                }
            });
            if (sList) sList = '<p style="font-weight: 700;">Total: UGX ' + fmt(stockValue) + '</p>' + sList;
            document.getElementById('stock-list').innerHTML = sList || '<p>None</p>';
        }

        function addPurchase() { const day = getDay(today); const item = document.getElementById('purch-item').value; const qty = parseInt(document.getElementById('purch-qty').value) || 0; const unitCost = parseInt(document.getElementById('purch-cost').value) || 0; if (!item || qty <= 0 || unitCost <= 0) return; day.purchases.push({item, qty, unitCost}); save({...load(), days: {...load().days, [today]: day}}); msg('Purchase added'); renderInventory(); }
        function autoFillUsageCost() { const day = getDay(today); const item = document.getElementById('usage-item').value; const p = day.purchases.find(x => x.item === item); document.getElementById('usage-cost').value = p ? p.unitCost : ''; }
        function addUsage() { const day = getDay(today); const item = document.getElementById('usage-item').value; const qty = parseInt(document.getElementById('usage-qty').value) || 0; const unitCost = parseInt(document.getElementById('usage-cost').value) || 0; if (!item || qty <= 0 || unitCost <= 0) return; day.usage.push({item, qty, unitCost, cost: qty * unitCost}); save({...load(), days: {...load().days, [today]: day}}); msg('Usage added'); renderInventory(); renderDashboard(); renderCapital(); }
        function delPurchase(i) { const day = getDay(today); day.purchases.splice(i, 1); save({...load(), days: {...load().days, [today]: day}}); renderInventory(); }
        function delUsage(i) { const day = getDay(today); day.usage.splice(i, 1); save({...load(), days: {...load().days, [today]: day}}); renderInventory(); renderDashboard(); renderCapital(); }

        function renderSales() {
            const day = getDay(today);
            const totalRev = day.sales.reduce((s, sl) => s + (sl.qty * sl.price), 0);
            let html = '<h3>Add Sale</h3>';
            html += '<div class="form-group"><select id="sale-prod"><option>Chapati</option><option>Eggs</option><option>Rolex</option></select></div>';
            html += '<div class="form-group"><input type="number" id="sale-qty" placeholder="Qty"></div>';
            html += '<div class="form-group"><input type="number" id="sale-price" placeholder="Price"></div>';
            html += '<button class="btn btn-primary" onclick="addSale()">✓ Add</button>';
            html += '<h3>Sales (' + day.sales.length + ')</h3><div id="sales-list"></div>';
            html += '<div class="summary"><div class="summary-row total"><span>REVENUE</span><span>UGX ' + fmt(totalRev) + '</span></div></div>';
            document.getElementById('sales-content').innerHTML = html;
            
            let sList = '';
            day.sales.forEach((s, i) => {
                sList += '<div class="item-card"><div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px;"><select id="sprod' + i + '" onchange="updateSale(' + i + ')"><option ' + (s.product === 'Chapati' ? 'selected' : '') + '>Chapati</option><option ' + (s.product === 'Eggs' ? 'selected' : '') + '>Eggs</option><option ' + (s.product === 'Rolex' ? 'selected' : '') + '>Rolex</option></select><input type="number" id="sqty' + i + '" value="' + s.qty + '" onchange="updateSale(' + i + ')" style="width: 100%;"><input type="number" id="sprice' + i + '" value="' + s.price + '" onchange="updateSale(' + i + ')" style="width: 100%;"></div><p style="font-size: 12px; font-weight: 700;">Total: UGX ' + fmt(s.qty * s.price) + '</p><button class="btn btn-danger" onclick="delSale(' + i + ')">Delete</button></div>';
            });
            document.getElementById('sales-list').innerHTML = sList || '<p>None</p>';
        }

        function addSale() { const day = getDay(today); const product = document.getElementById('sale-prod').value; const qty = parseInt(document.getElementById('sale-qty').value) || 0; const price = parseInt(document.getElementById('sale-price').value) || 0; if (qty <= 0 || price <= 0) return; day.sales.push({product, qty, price}); save({...load(), days: {...load().days, [today]: day}}); msg('Sale added'); renderSales(); renderDashboard(); renderCapital(); }
        function updateSale(i) { const day = getDay(today); const product = document.getElementById('sprod' + i).value; const qty = parseInt(document.getElementById('sqty' + i).value) || 0; const price = parseInt(document.getElementById('sprice' + i).value) || 0; if (qty <= 0 || price <= 0) return; day.sales[i] = {product, qty, price}; save({...load(), days: {...load().days, [today]: day}}); renderSales(); renderDashboard(); renderCapital(); }
        function delSale(i) { const day = getDay(today); day.sales.splice(i, 1); save({...load(), days: {...load().days, [today]: day}}); renderSales(); renderDashboard(); renderCapital(); }

        function renderDebtors() {
            const day = getDay(today);
            let totalOwing = 0;
            day.debtors.forEach(d => { totalOwing += d.amount - (d.paid || 0); });
            let html = '<h3>Give Credit</h3>';
            html += '<div class="form-group"><input type="text" id="debt-name" placeholder="Name"></div>';
            html += '<div class="form-group"><input type="number" id="debt-amount" placeholder="Amount"></div>';
            html += '<button class="btn btn-primary" onclick="addDebtor()">✓ Add</button>';
            html += '<h3>Debtors (' + day.debtors.length + ')</h3><div id="debtors-list"></div>';
            html += '<div class="summary"><div class="summary-row total"><span>Owing</span><span>UGX ' + fmt(totalOwing) + '</span></div></div>';
            document.getElementById('debtors-content').innerHTML = html;
            
            let dList = '';
            day.debtors.forEach((d, i) => {
                const balance = d.amount - (d.paid || 0);
                dList += '<div class="item-card"><p><strong>' + d.name + '</strong></p><p style="font-size: 12px;">Owed: ' + fmt(d.amount) + ' | Paid: ' + fmt(d.paid || 0) + ' | Balance: ' + fmt(balance) + '</p>';
                if (balance > 0) { dList += '<input type="number" id="dpmt' + i + '" placeholder="Payment"><button class="btn btn-primary" onclick="recDebtorPmt(' + i + ')" style="font-size: 12px; padding: 8px;">Record</button>'; }
                dList += '<button class="btn btn-danger" onclick="delDebtor(' + i + ')">Delete</button></div>';
            });
            document.getElementById('debtors-list').innerHTML = dList || '<p>None</p>';
        }

        function addDebtor() { const day = getDay(today); const name = document.getElementById('debt-name').value; const amount = parseInt(document.getElementById('debt-amount').value) || 0; if (!name || amount <= 0) return; day.debtors.push({name, amount, paid: 0}); save({...load(), days: {...load().days, [today]: day}}); msg('Debtor added'); renderDebtors(); renderCapital(); }
        function recDebtorPmt(i) { const day = getDay(today); const pmt = parseInt(document.getElementById('dpmt' + i).value) || 0; if (pmt <= 0) return; day.debtors[i].paid = (day.debtors[i].paid || 0) + pmt; save({...load(), days: {...load().days, [today]: day}}); msg('Payment recorded'); renderDebtors(); renderCapital(); }
        function delDebtor(i) { const day = getDay(today); day.debtors.splice(i, 1); save({...load(), days: {...load().days, [today]: day}}); renderDebtors(); renderCapital(); }

        function renderCreditors() {
            const day = getDay(today);
            let totalOwed = 0;
            day.creditors.forEach(c => { totalOwed += c.amount - (c.paid || 0); });
            let html = '<h3>Buy on Credit</h3>';
            html += '<div class="form-group"><input type="text" id="cred-name" placeholder="Name"></div>';
            html += '<div class="form-group"><input type="number" id="cred-amount" placeholder="Amount"></div>';
            html += '<button class="btn btn-primary" onclick="addCreditor()">✓ Add</button>';
            html += '<h3>Creditors (' + day.creditors.length + ')</h3><div id="creditors-list"></div>';
            html += '<div class="summary"><div class="summary-row total"><span>Owed</span><span>UGX ' + fmt(totalOwed) + '</span></div></div>';
            document.getElementById('creditors-content').innerHTML = html;
            
            let cList = '';
            day.creditors.forEach((c, i) => {
                const balance = c.amount - (c.paid || 0);
                cList += '<div class="item-card"><p><strong>' + c.name + '</strong></p><p style="font-size: 12px;">Owed: ' + fmt(c.amount) + ' | Paid: ' + fmt(c.paid || 0) + ' | Balance: ' + fmt(balance) + '</p>';
                if (balance > 0) { cList += '<input type="number" id="cpmt' + i + '" placeholder="Payment"><button class="btn btn-primary" onclick="recCreditorPmt(' + i + ')" style="font-size: 12px; padding: 8px;">Record</button>'; }
                cList += '<button class="btn btn-danger" onclick="delCreditor(' + i + ')">Delete</button></div>';
            });
            document.getElementById('creditors-list').innerHTML = cList || '<p>None</p>';
        }

        function addCreditor() { const day = getDay(today); const name = document.getElementById('cred-name').value; const amount = parseInt(document.getElementById('cred-amount').value) || 0; if (!name || amount <= 0) return; day.creditors.push({name, amount, paid: 0}); save({...load(), days: {...load().days, [today]: day}}); msg('Creditor added'); renderCreditors(); renderCapital(); }
        function recCreditorPmt(i) { const day = getDay(today); const pmt = parseInt(document.getElementById('cpmt' + i).value) || 0; if (pmt <= 0) return; day.creditors[i].paid = (day.creditors[i].paid || 0) + pmt; save({...load(), days: {...load().days, [today]: day}}); msg('Payment recorded'); renderCreditors(); renderCapital(); }
        function delCreditor(i) { const day = getDay(today); day.creditors.splice(i, 1); save({...load(), days: {...load().days, [today]: day}}); renderCreditors(); renderCapital(); }

        function renderExpenses() {
            const day = getDay(today);
            const totalExp = day.expenses.reduce((s, e) => s + e.amount, 0);
            let html = '<h3>Add Expense</h3>';
            html += '<div class="form-group"><input type="text" id="exp-desc" placeholder="Description"></div>';
            html += '<div class="form-group"><select id="exp-cat"><option>Meals</option><option>Transport</option><option>Packaging</option><option>Other</option></select></div>';
            html += '<div class="form-group"><input type="number" id="exp-amt" placeholder="Amount"></div>';
            html += '<button class="btn btn-primary" onclick="addExpense()">✓ Add</button>';
            html += '<h3>Expenses (' + day.expenses.length + ')</h3><div id="expenses-list"></div>';
            html += '<div class="summary"><div class="summary-row total"><span>TOTAL</span><span>UGX ' + fmt(totalExp) + '</span></div></div>';
            document.getElementById('expenses-content').innerHTML = html;
            
            let eList = '';
            day.expenses.forEach((e, i) => {
                eList += '<div class="item-card"><p><strong>' + e.desc + '</strong> - UGX ' + fmt(e.amount) + ' (' + e.category + ')</p><button class="btn btn-danger" onclick="delExpense(' + i + ')">Delete</button></div>';
            });
            document.getElementById('expenses-list').innerHTML = eList || '<p>None</p>';
        }

        function addExpense() { const day = getDay(today); const desc = document.getElementById('exp-desc').value; const cat = document.getElementById('exp-cat').value; const amount = parseInt(document.getElementById('exp-amt').value) || 0; if (!desc || amount <= 0) return; day.expenses.push({desc, category: cat, amount}); save({...load(), days: {...load().days, [today]: day}}); msg('Expense added'); renderExpenses(); renderDashboard(); renderCapital(); }
        function delExpense(i) { const day = getDay(today); day.expenses.splice(i, 1); save({...load(), days: {...load().days, [today]: day}}); renderExpenses(); renderDashboard(); renderCapital(); }

        function renderCapital() {
            const day = getDay(today);
            const revenue = day.sales.reduce((s, sl) => s + (sl.qty * sl.price), 0);
            const cogs = day.usage.reduce((s, u) => s + u.cost, 0);
            const expenses = day.expenses.reduce((s, e) => s + e.amount, 0);
            let stock = 0;
            day.purchases.forEach(p => { const used = day.usage.filter(u => u.item === p.item).reduce((s, u) => s + u.qty, 0); stock += (p.qty - used) * p.unitCost; });
            let debtors = 0;
            day.debtors.forEach(d => { debtors += d.amount - (d.paid || 0); });
            let creditors = 0;
            day.creditors.forEach(c => { creditors += c.amount - (c.paid || 0); });
            const capital = revenue + stock - cogs - expenses - debtors + creditors;
            
            const yesterday = new Date(new Date(today).getTime() - 86400000).toISOString().split('T')[0];
            const data = load();
            let yesterdayCapital = 0;
            if (data.days[yesterday]) {
                const yday = data.days[yesterday];
                const yrev = yday.sales.reduce((s, sl) => s + (sl.qty * sl.price), 0);
                const ycogs = yday.usage.reduce((s, u) => s + u.cost, 0);
                const yexp = yday.expenses.reduce((s, e) => s + e.amount, 0);
                let ystock = 0;
                yday.purchases.forEach(p => { const used = yday.usage.filter(u => u.item === p.item).reduce((s, u) => s + u.qty, 0); ystock += (p.qty - used) * p.unitCost; });
                let ydebtors = 0;
                yday.debtors.forEach(d => { ydebtors += d.amount - (d.paid || 0); });
                let ycreditors = 0;
                yday.creditors.forEach(c => { ycreditors += c.amount - (c.paid || 0); });
                yesterdayCapital = yrev + ystock - ycogs - yexp - ydebtors + ycreditors;
            }
            
            const position = capital - yesterdayCapital;
            let posIcon = position > 0 ? '📈 INCREASING' : (position < 0 ? '📉 DECREASING' : '➡️ STABLE');
            let posColor = position > 0 ? '#27a745' : (position < 0 ? '#dc3545' : '#666');
            
            let html = '<h3>Today\'s Capital</h3>';
            html += '<div class="summary">';
            html += '<div class="summary-row"><span>💵 Cash</span><span>UGX ' + fmt(revenue) + '</span></div>';
            html += '<div class="summary-row"><span>📦 Stock</span><span>UGX ' + fmt(stock) + '</span></div>';
            html += '<div class="summary-row"><span>❌ COGS</span><span>UGX ' + fmt(cogs) + '</span></div>';
            html += '<div class="summary-row"><span>❌ Expenses</span><span>UGX ' + fmt(expenses) + '</span></div>';
            html += '<div class="summary-row"><span>👥 Debtors</span><span>UGX ' + fmt(debtors) + '</span></div>';
            html += '<div class="summary-row"><span>🏪 Creditors</span><span>UGX ' + fmt(creditors) + '</span></div>';
            html += '<div class="summary-row total"><span>TOTAL CAPITAL</span><span style="color: ' + (capital > 0 ? '#27a745' : '#dc3545') + ';">UGX ' + fmt(Math.abs(capital)) + '</span></div>';
            html += '</div>';
            html += '<h3>Net Position</h3>';
            html += '<div class="summary">';
            html += '<div class="summary-row"><span>Yesterday</span><span>UGX ' + fmt(yesterdayCapital) + '</span></div>';
            html += '<div class="summary-row"><span>Today</span><span>UGX ' + fmt(capital) + '</span></div>';
            html += '<div class="summary-row total"><span>Change</span><span style="color: ' + posColor + ';">' + posIcon + ' UGX ' + fmt(Math.abs(position)) + '</span></div>';
            html += '</div>';
            document.getElementById('capital-content').innerHTML = html;
        }

        function renderAnalytics() {
            const data = load();
            const days = Object.keys(data.days).sort();
            const last7 = days.slice(-7);
            let totalRev = 0, totalCogs = 0, totalExp = 0, totalProfit = 0;
            last7.forEach(date => {
                const day = data.days[date];
                const rev = day.sales.reduce((s, sl) => s + (sl.qty * sl.price), 0);
                const cogs = day.usage.reduce((s, u) => s + u.cost, 0);
                const exp = day.expenses.reduce((s, e) => s + e.amount, 0);
                const profit = rev - cogs - exp;
                totalRev += rev;
                totalCogs += cogs;
                totalExp += exp;
                totalProfit += profit;
            });
            let html = '<h3>Last 7 Days</h3>';
            html += '<div class="summary">';
            html += '<div class="summary-row"><span>Revenue</span><span>UGX ' + fmt(totalRev) + '</span></div>';
            html += '<div class="summary-row"><span>COGS</span><span>UGX ' + fmt(totalCogs) + '</span></div>';
            html += '<div class="summary-row"><span>Expenses</span><span>UGX ' + fmt(totalExp) + '</span></div>';
            html += '<div class="summary-row total"><span>Profit</span><span style="color: ' + (totalProfit > 0 ? '#27a745' : '#dc3545') + ';">UGX ' + fmt(Math.abs(totalProfit)) + '</span></div>';
            html += '</div><h3>Daily</h3>';
            last7.forEach(date => {
                const day = data.days[date];
                const rev = day.sales.reduce((s, sl) => s + (sl.qty * sl.price), 0);
                const cogs = day.usage.reduce((s, u) => s + u.cost, 0);
                const exp = day.expenses.reduce((s, e) => s + e.amount, 0);
                const profit = rev - cogs - exp;
                html += '<div class="item-card"><p><strong>' + date + '</strong></p><p style="font-size: 12px;">Rev: ' + fmt(rev) + ' | COGS: ' + fmt(cogs) + ' | Exp: ' + fmt(exp) + '</p><p style="font-size: 12px; font-weight: 700;">Profit: UGX ' + fmt(Math.abs(profit)) + '</p></div>';
            });
            document.getElementById('analytics-content').innerHTML = html;
        }

        function renderHistory() {
            const data = load();
            const days = Object.keys(data.days).sort().reverse();
            let html = '<h3>All Days (' + days.length + ')</h3>';
            days.forEach(date => {
                const day = data.days[date];
                const rev = day.sales.reduce((s, sl) => s + (sl.qty * sl.price), 0);
                const cogs = day.usage.reduce((s, u) => s + u.cost, 0);
                const exp = day.expenses.reduce((s, e) => s + e.amount, 0);
                const profit = rev - cogs - exp;
                html += '<div class="item-card" onclick="showHistoryDetail(\'' + date + '\')" style="cursor: pointer; user-select: none;">';
                html += '<p><strong>' + date + '</strong> <span style="font-size: 11px; color: #999;">(' + day.status + ')</span></p>';
                html += '<p style="font-size: 12px;">Rev: UGX ' + fmt(rev) + ' | Profit: UGX ' + fmt(profit) + '</p>';
                html += '<p style="font-size: 11px; color: #0066cc;">Tap to view details</p>';
                html += '</div>';
            });
            if (days.length === 0) html += '<p>No records</p>';
            document.getElementById('history-content').innerHTML = html;
        }

        function showHistoryDetail(date) {
            const data = load();
            const day = data.days[date];
            if (!day) return;
            
            const rev = day.sales.reduce((s, sl) => s + (sl.qty * sl.price), 0);
            const cogs = day.usage.reduce((s, u) => s + u.cost, 0);
            const exp = day.expenses.reduce((s, e) => s + e.amount, 0);
            const profit = rev - cogs - exp;
            const carried = day.chapatiCarried || 0;
            const made = day.chapatiMade || 0;
            const remaining = day.chapatiRemaining || 0;
            const sold = (carried + made) - remaining;
            
            let html = '<h3>Details - ' + date + '</h3>';
            html += '<h4 style="font-size: 12px; margin-top: 16px; color: #666; font-weight: 700;">PRODUCTION</h4>';
            html += '<div class="summary">';
            html += '<div class="summary-row"><span>Carried</span><span>' + carried + '</span></div>';
            html += '<div class="summary-row"><span>Made</span><span>' + made + '</span></div>';
            html += '<div class="summary-row"><span>Total Available</span><span>' + (carried + made) + '</span></div>';
            html += '<div class="summary-row"><span>Remaining</span><span>' + remaining + '</span></div>';
            html += '<div class="summary-row total"><span>SOLD</span><span>' + sold + '</span></div>';
            html += '</div>';
            
            html += '<h4 style="font-size: 12px; margin-top: 16px; color: #666; font-weight: 700;">FINANCIAL</h4>';
            html += '<div class="summary">';
            html += '<div class="summary-row"><span>Revenue</span><span>UGX ' + fmt(rev) + '</span></div>';
            html += '<div class="summary-row"><span>COGS</span><span>UGX ' + fmt(cogs) + '</span></div>';
            html += '<div class="summary-row"><span>Expenses</span><span>UGX ' + fmt(exp) + '</span></div>';
            html += '<div class="summary-row total"><span>PROFIT</span><span style="color: ' + (profit > 0 ? '#27a745' : '#dc3545') + ';">UGX ' + fmt(Math.abs(profit)) + '</span></div>';
            html += '</div>';
            
            if (day.sales.length > 0) {
                html += '<h4 style="font-size: 12px; margin-top: 16px; color: #666; font-weight: 700;">SALES (' + day.sales.length + ')</h4>';
                day.sales.forEach(s => {
                    html += '<div class="item-card"><p style="font-size: 12px;"><strong>' + s.product + '</strong> - ' + s.qty + ' @ UGX ' + fmt(s.price) + ' = UGX ' + fmt(s.qty * s.price) + '</p></div>';
                });
            }
            
            if (day.debtors.length > 0) {
                html += '<h4 style="font-size: 12px; margin-top: 16px; color: #666; font-weight: 700;">DEBTORS (' + day.debtors.length + ')</h4>';
                day.debtors.forEach(d => {
                    html += '<div class="item-card"><p style="font-size: 12px;"><strong>' + d.name + '</strong> - Owed: UGX ' + fmt(d.amount) + ' | Paid: UGX ' + fmt(d.paid || 0) + '</p></div>';
                });
            }
            
            if (day.creditors.length > 0) {
                html += '<h4 style="font-size: 12px; margin-top: 16px; color: #666; font-weight: 700;">CREDITORS (' + day.creditors.length + ')</h4>';
                day.creditors.forEach(c => {
                    html += '<div class="item-card"><p style="font-size: 12px;"><strong>' + c.name + '</strong> - Owed: UGX ' + fmt(c.amount) + ' | Paid: UGX ' + fmt(c.paid || 0) + '</p></div>';
                });
            }
            
            html += '<button class="btn btn-primary" onclick="renderHistory()" style="margin-top: 16px;">← Back to History</button>';
            document.getElementById('history-content').innerHTML = html;
        }

        function renderClose() {
            const day = getDay(today);
            const revenue = day.sales.reduce((s, sl) => s + (sl.qty * sl.price), 0);
            const cogs = day.usage.reduce((s, u) => s + u.cost, 0);
            const expenses = day.expenses.reduce((s, e) => s + e.amount, 0);
            const profit = revenue - cogs - expenses;
            
            // Calculate closing inventory items
            let closingItems = [];
            day.purchases.forEach(p => {
                const used = day.usage.filter(u => u.item === p.item).reduce((s, u) => s + u.qty, 0);
                const remain = p.qty - used;
                if (remain > 0) closingItems.push({name: p.item, qty: remain, unitCost: p.unitCost});
            });
            
            let html = '<h3>Day Summary</h3>';
            html += '<div class="summary">';
            html += '<div class="summary-row"><span>Revenue</span><span>UGX ' + fmt(revenue) + '</span></div>';
            html += '<div class="summary-row"><span>COGS</span><span>UGX ' + fmt(cogs) + '</span></div>';
            html += '<div class="summary-row"><span>Expenses</span><span>UGX ' + fmt(expenses) + '</span></div>';
            html += '<div class="summary-row total"><span>PROFIT</span><span style="color: ' + (profit > 0 ? '#27a745' : '#dc3545') + ';">UGX ' + fmt(Math.abs(profit)) + '</span></div>';
            html += '</div>';
            
            html += '<h3>Closing Inventory (Carry to Next Day)</h3>';
            if (day.chapatiRemaining > 0) {
                html += '<p style="font-size: 12px;"><strong>Chapati:</strong> ' + day.chapatiRemaining + '</p>';
            }
            if (closingItems.length > 0) {
                closingItems.forEach(item => {
                    html += '<p style="font-size: 12px;"><strong>' + item.name + ':</strong> ' + item.qty + ' @ UGX ' + fmt(item.unitCost) + '</p>';
                });
            } else {
                html += '<p style="font-size: 12px; color: #999;">No items to carry over</p>';
            }
            
            html += '<button class="btn btn-primary" onclick="closeDay()" style="margin-top: 16px;">✓ Close Day & Move to Tomorrow</button>';
            document.getElementById('close-content').innerHTML = html;
        }

        function closeDay() {
            const day = getDay(today);
            const closingItems = [];
            day.purchases.forEach(p => {
                const used = day.usage.filter(u => u.item === p.item).reduce((s, u) => s + u.qty, 0);
                const remain = p.qty - used;
                if (remain > 0) closingItems.push({name: p.item, qty: remain, unitCost: p.unitCost});
            });
            day.closingInventory = {chapati: day.chapatiRemaining || 0, items: closingItems};
            day.status = 'closed';
            const data = load();
            data.days[today] = day;
            save(data);
            today = new Date(new Date(today).getTime() + 86400000).toISOString().split('T')[0];
            msg('Day closed - inventory carried over');
            renderDashboard();
            showTab('dashboard');
        }

        function downloadBackup() { const blob = new Blob([JSON.stringify(load(), null, 2)], {type: 'application/json'}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'backup.json'; a.click(); URL.revokeObjectURL(url); }
        function restoreBackup() { const file = document.getElementById('restore-file').files[0]; if (!file) return; const reader = new FileReader(); reader.onload = e => { try { save(JSON.parse(e.target.result)); location.reload(); } catch (err) { alert('Error'); } }; reader.readAsText(file); }

        window.addEventListener('load', () => renderDashboard());
    </script>
</body>
